#    image: redis:latest
#    container_name: redis
#    command: redis-server --save 20 1 --loglevel warning --requirepass 123QWEasd
#    ports:
#      - 63799:6379
#    volumes:
#      - ./docker/redis/data:/var/lib/redis
#    environment:
#     - REDIS_REPLICATION_MODE=master
#    networks:
#      - backend

networks:
  backend:
